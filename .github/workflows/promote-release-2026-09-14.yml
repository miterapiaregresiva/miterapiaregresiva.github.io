name: Promote static HTML brand release 2026-09-14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-release-2026-09-14.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: prod

      - name: Checkout frozen staging release
        run: |
          git clone --depth 1 --branch release-2026-09-14-static-brand-html https://github.com/miterapiaregresiva/stg.git source

      - name: Copy release into production
        run: |
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'CNAME' \
            source/ prod/
          printf '%s\n' 'miterapiaregresiva.com' > prod/CNAME

      - name: Apply production metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('prod')
          production = 'https://miterapiaregresiva.com'

          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.css', '.xml', '.txt', '.webmanifest'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              text = text.replace('<base href="/mtr/">', '<base href="/">')
              text = text.replace('https://stg.miterapiaregresiva.com', production)
              text = text.replace('https://github.com/miterapiaregresiva/stg/blob/main/LICENSE', 'https://github.com/miterapiaregresiva/miterapiaregresiva.github.io/blob/main/LICENSE')

              if path.suffix.lower() == '.html':
                  if path.name != '404.html':
                      text = re.sub(r'<meta\s+name=["\']robots["\']\s+content=["\']noindex,nofollow["\']\s*/?>', '', text, flags=re.I)
                      rel = path.relative_to(root)
                      if rel.as_posix() == 'index.html':
                          canonical = production + '/'
                      elif rel.name == 'index.html':
                          canonical = production + '/' + rel.parent.as_posix().strip('/') + '/'
                      else:
                          canonical = production + '/' + rel.as_posix()
                      if 'rel="canonical"' not in text and "rel='canonical'" not in text:
                          text = text.replace('</head>', f'<link rel="canonical" href="{canonical}"></head>', 1)
                  elif 'noindex' not in text.lower():
                      text = text.replace('</head>', '<meta name="robots" content="noindex,nofollow"></head>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate production build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('prod')
          problems = []
          header_pages = 0
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.css', '.xml', '.txt', '.webmanifest'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '/mtr/' in text:
                  problems.append(f'{path}: contains /mtr/')
              if 'stg.miterapiaregresiva.com' in text:
                  problems.append(f'{path}: contains staging hostname')
              if path.suffix.lower() == '.html':
                  if 'site-header' in text:
                      header_pages += 1
                      if text.count('class="brand brand-lockup"') != 1:
                          problems.append(f'{path}: static brand lockup missing or duplicated')
                      for marker in ['class="brand-copy"', 'Explora tu historia. Comprende tu presente.', 'Terapia regresiva en Tenerife', 'assets/brand-lockup.css']:
                          if marker not in text:
                              problems.append(f'{path}: missing brand marker {marker}')
                  if path.name != '404.html':
                      if 'noindex,nofollow' in text.lower():
                          problems.append(f'{path}: still noindex')
                      if 'rel="canonical"' not in text and "rel='canonical'" not in text:
                          problems.append(f'{path}: missing canonical')

          if not header_pages:
              problems.append('no HTML header pages found')
          if not (root / 'assets/brand-lockup.css').exists():
              problems.append('brand-lockup.css missing')
          if not (root / 'assets/images/branding/mi-terapia-regresiva-simbolo.svg').exists():
              problems.append('brand symbol SVG missing')

          js = (root / 'assets/site.js').read_text(encoding='utf-8')
          if 'brand.innerHTML' in js or "querySelectorAll('.site-header .brand')" in js:
              problems.append('site.js still constructs header brand dynamically')

          cname = (root / 'CNAME').read_text(encoding='utf-8').strip()
          if cname != 'miterapiaregresiva.com':
              problems.append('CNAME is not production domain')
          robots = (root / 'robots.txt').read_text(encoding='utf-8')
          if 'Allow: /' not in robots or 'https://miterapiaregresiva.com/sitemap.xml' not in robots:
              problems.append('robots.txt is not production-ready')
          if 'noindex' not in (root / '404.html').read_text(encoding='utf-8').lower():
              problems.append('404.html must remain noindex')
          if problems:
              raise SystemExit('\n'.join(problems))
          print(f'Validated {header_pages} static HTML headers for production.')
          PY

      - name: Publish release
        working-directory: prod
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No production changes to publish.'
            exit 0
          fi
          git commit -m 'Promote static HTML brand headers to production'
          git push origin main
